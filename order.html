<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Room Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Room Scent</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1 class="page-title">สั่งซื้อสินค้า</h1>
        <p class="lead">กรอกข้อมูลสำหรับการติดต่อ แล้วกดยืนยันสั่งซื้อ</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form id="orderForm" class="form">

          <div class="form-field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="form-field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="form-field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
            <p class="form-hint">หากต้องการสั่งหลายรายการ สามารถพิมพ์เพิ่มได้ และปรับจำนวนเงินรวมให้ตรงกัน</p>
          </div>

          <div class="form-field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>

          <div class="form-field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>
          </div>

        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>&copy; 2026 Room Scent</span>
      <nav aria-label="ลิงก์ท้ายหน้า">
        <a href="product.html">เลือกสินค้าเพิ่มเติม</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
